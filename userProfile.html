<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="userProfile.css"> 
</head>

<body>

    <div class="container">
        <h2>User Profile</h2>

        <div id="profile-data">
            <p>Loading profile data...</p> 
        </div>

        <button id="editProfileButton">Edit Profile</button>
        <button id="deleteUserButton">Delete Account</button>

        <form id="editProfileForm" style="display: none;"> 
            <div class="form-group"> 
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group"> 
                <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="birthdate">Date of Birth:</label>
                <input type="date" id="birthdate" name="birthdate" required>
            </div>
            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" placeholder="Enter your location" required>
            </div>
            <div class="form-group">
                <label for="dietaryPreference">Dietary Preference:</label>
                <input type="text" id="dietaryPreference" name="dietaryPreference" placeholder="e.g., Vegetarian, Vegan" required>
            </div>
            <div class="form-group">
                <label for="activityLevel">Activity Level:</label>
                <input type="text" id="activityLevel" name="activityLevel" placeholder="e.g., Low, Moderate, High" required>
            </div>
            <div class="form-group">
                <label for="healthGoals">Health Goals:</label>
                <input type="text" id="healthGoals" name="healthGoals" placeholder="e.g., Weight Loss, Maintain Weight" required>
            </div>
            <div class="form-group">
                <label for="allergies">Allergies:</label>
                <input type="text" id="allergies" name="allergies" placeholder="e.g., Dairy, Nuts"> 
            </div>
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" name="height" min="0" required>
            </div>
            <div class="form-group">
                <label for="medicalConditions">Medical Conditions:</label>
                <input type="text" id="medicalConditions" name="medicalConditions" placeholder="e.g., Diabetes, Hypertension"> 
            </div>
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" min="0" required>
            </div>
            <button type="submit">Save Changes</button>
            <button type="button" id="cancelEditButton">Cancel</button>
        </form>
    </div>

    <script src="userProfile.js"></script>
</body>

</html>
